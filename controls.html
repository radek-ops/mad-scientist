<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controls – Mad Scientist</title>
    <link rel="stylesheet" href="style/fonts.css">
    <link rel="stylesheet" href="style/controls.css">
    <link rel="icon" type="image/png" href="img/Favicon/Icon.png">
    <script defer src="./js/mute.js"></script>
    <script defer src="./js/menu-sound.js"></script>
</head>

<body>
    <main class="ctrls-main">
        <div class="ctrls-container">

            <h1 class="ctrls-title">
                <span class="mad">MAD</span>
                <span class="scientist">SCIENTIST</span>
            </h1>

            <h2 class="ctrls-h2">Controls</h2>

            <p class="ctrls-text">On mobile: use the on-screen touch buttons (D-Pad, Jump, Shoot, Bomb, HP). The HP button uses a potion to heal &ndash; same as the R key.</p>

            <div class="ctrls-table">
                <div class="ctrls-row"><span class="ctrls-key">W</span><span class="ctrls-action">Up</span></div>
                <div class="ctrls-row"><span class="ctrls-key">A</span><span class="ctrls-action">Left</span></div>
                <div class="ctrls-row"><span class="ctrls-key">S</span><span class="ctrls-action">Down</span></div>
                <div class="ctrls-row"><span class="ctrls-key">D</span><span class="ctrls-action">Right</span></div>
                <div class="ctrls-row"><span class="ctrls-key">Space</span><span class="ctrls-action">Jump</span></div>
                <div class="ctrls-row"><span class="ctrls-key">Left Click</span><span class="ctrls-action">Shoot</span></div>
                <div class="ctrls-row"><span class="ctrls-key">Right Click</span><span class="ctrls-action">Bomb</span></div>
                <div class="ctrls-row"><span class="ctrls-key">R</span><span class="ctrls-action">Use Potion (Heal)</span></div>
                <div class="ctrls-row"><span class="ctrls-key">Esc</span><span class="ctrls-action">Break</span></div>
            </div>

            <div class="ctrls-buttons">
                <button class="mute-btn" type="button">🔊 Sound On</button>
                <a href="./index.html" class="btn-back">Back</a>
            </div>

        </div>
    </main>
</body>

</html>
