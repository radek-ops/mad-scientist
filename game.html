<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mad Scientist</title>

    <link rel="stylesheet" href="style/fonts.css">
    <link rel="stylesheet" href="style/game.css">
    <link rel="icon" type="image/png" href="./img/Favicon/Icon.png">
    <script>
        if (new URLSearchParams(location.search).get('touch') === '1') {
            document.documentElement.classList.add('force-touch');
        }
    </script>

    <script defer src="./js/models/controls.class.js"></script>
    <script defer src="./js/models/moveables.class.js"></script>
    <script defer src="./js/models/final-boss.class.js"></script>
    <script defer src="./js/models/guns-projectiles.class.js"></script>
    <script defer src="./js/models/main-character.class.js"></script>
    <script defer src="./js/models/enemy-character.class.js"></script>
     <script defer src="./js/models/potions.class.js"></script>
    <script defer src="./js/models/bomb.class.js"></script>
    <script defer src="./js/models/thrown-bomb.class.js"></script>
    <script defer src="./js/models/boxing.class.js"></script>
    <script defer src="./js/models/status-bar.class.js"></script>
     <script defer src="./js/models/hp-bar.class.js"></script>
    <script defer src="./js/models/boss-hp-bar.class.js"></script>
    <script defer src="./js/models/sound.class.js"></script>
    <script defer src="./js/mute.js"></script>
    <script defer src="./js/menu-sound.js"></script>
    <script defer src="./js/models/background.class.js"></script>
    <script defer src="./js/models/world.class.js"></script>
    <script defer src="./js/models/world-collisions.js"></script>
    <script defer src="./js/models/world-items.js"></script>
    <script defer src="./js/models/world-boss.js"></script>
    <script defer src="./js/game.js"></script>

</head>


<body onload="init()">
    <div class="landscape-warning">
        <div class="warning-message">
            <h1>Please rotate your device</h1>
            <p>🔄 Landscape mode required</p>
        </div>
    </div>
    <main>

        <div class="main-content">
            <h1>
                <span class="mad">MAD</span>
                <span class="scientist">SCIENTIST</span>
            </h1>
            <canvas id="canvas" width="1280" height="720"></canvas>
            <span class="game-credit">Created by Radek Gnych &copy;</span>
        </div>
    </main>

    <div id="touch-controls">
        <div class="dpad">
            <button class="touch-btn" id="btn-up" type="button">↑</button>
            <button class="touch-btn" id="btn-left" type="button">←</button>
            <button class="touch-btn" id="btn-right" type="button">→</button>
            <button class="touch-btn" id="btn-down" type="button">↓</button>
        </div>
        <button class="touch-btn" id="btn-potion" type="button">HP</button>
        <button class="touch-btn" id="btn-jump" type="button">Jump</button>
        <button class="touch-btn" id="btn-shoot" type="button">Shoot</button>
        <button class="touch-btn" id="btn-bomb" type="button">Bomb</button>
    </div>

    <div id="gameOverOverlay" class="game-over-overlay">
        <div class="game-over-content">
            <h1 class="game-over-title">You are dead</h1>
            <a href="./game.html" class="try-again-btn">Try Again</a>
        </div>
    </div>

    <div id="winOverlay" class="win-overlay">
        <div class="win-content">
            <img src="./img/PNG/User_Interfaces/Accomplished.png" alt="Accomplished" class="win-image">
            <a href="./index.html" class="new-game-btn">New Game</a>
        </div>
    </div>
</body>

</html>
