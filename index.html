<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mad Scientist</title>
    <link rel="stylesheet" href="style/fonts.css">
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" type="image/png" href="./img/Favicon/Icon.png">
    <script defer src="./js/mute.js"></script>
    <script defer src="./js/description.js"></script>
</head>

<body>
    <main class="start-main">
        <div class="start-container">

            <h1 class="start-title">
                <span class="mad">MAD</span>
                <span class="scientist">SCIENTIST</span>
            </h1>

            <div class="start-row">
                <img class="start-char" src="./img/PNG/Main_Characters/Gun05/Idle/Idle_000.png" alt="Character">
                <div class="start-buttons">
                    <a href="./game.html" class="start-button">Start Game</a>
                    <a href="./controls.html" class="start-button">Controls</a>
                    <button class="start-button" type="button" id="description-btn">Description</button>
                </div>
            </div>


            <div class="start-footer">

                <a href="./impressum.html" class="btn-impressum-start">Impressum</a>

            </div>
        </div>
    </main>

    <div class="description-overlay" id="description-overlay" hidden>
        <div class="description-container">
            <button class="description-back" type="button" id="description-back">Back</button>
            <h1 class="description-title">
                <span class="mad">MAD</span>
                <span class="scientist">SCIENTIST</span>
            </h1>
            <h2 class="description-h2">Description</h2>
            <p class="start-text">Fight through a lab full of enemies, collect bombs and potions, and defeat the final
                boss!</p>
            <p class="start-text">Enemies with a shield can only be killed from behind with the laser, by jumping on
                their heads or through the bomb.</p>

        </div>
    </div>
</body>

</html>
